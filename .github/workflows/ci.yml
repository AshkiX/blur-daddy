name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run pytest -v

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install package in fresh venv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python .

      - name: Run blur-daddy CLI
        run: /tmp/smoke-venv/bin/blur-daddy blur sample_images/sample1.jpg -o /tmp/out.jpg

      - name: Assert output file exists
        run: test -f /tmp/out.jpg
