[project]
name = "blur-daddy"
version = "0.3.0"
description = "Fast, accurate face blurring for images and videos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.13"
dependencies = [
    "facenet-pytorch>=2.5.3",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "tqdm>=4.60.0",
    "psutil>=5.9.0",
    "omegaconf>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/AshkiX/blur-daddy"

[project.scripts]
blur-daddy = "blur_daddy.cli:main_cli"
blur-daddy-resize = "blur_daddy.resize:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blur_daddy"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "scikit-image>=0.24.0",
]
benchmark = [
    "deface>=1.5.0",
    "insightface>=0.7.3",
    "mediapipe>=0.10.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "onnxruntime>=1.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["docker: requires Docker daemon"]
addopts = "-m 'not docker'"
